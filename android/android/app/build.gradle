plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mixtape.app'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.mixtape.app'
        minSdk 29          // Android 10+: сохранение в «Музыку» и «Загрузки» без лишних разрешений
        targetSdk 34
        versionCode 1
        versionName '2.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_static' }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // подпись отладочным ключом: APK ставится на телефон напрямую, без магазина
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Иконка и картинка Тето — из общей папки resources (те же, что у версии для Windows)
tasks.register('copyMixtapeResources') {
    doLast {
        copy {
            from '../../resources/icon.png'
            into 'src/main/res/mipmap-xxxhdpi'
            rename { 'ic_launcher.png' }
        }
        copy {
            from '../../resources/teto.png'
            into 'src/main/assets'
        }
    }
}
preBuild.dependsOn 'copyMixtapeResources'
